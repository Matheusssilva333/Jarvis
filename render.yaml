services:
  - type: web
    name: jarvis-sao-system
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py --web
    healthCheckPath: /api/stats
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEFAULT_LLM_PROVIDER
        value: gemini
      - key: PORT
        value: 8080
